version: '3.8'

services:
  account-service:
    image: ${DOCKER_REGISTRY-}account-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - UID=1000
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-YourSuperSecretKeyForDevEnvironment}
      - JwtSettings__Issuer=AccountService
      - JwtSettings__Audience=AccountServiceClients
      - JwtSettings__ExpiryMinutes=60
      - ConnectionStrings__AccountService=Host=db;Database=account_service;Username=postgres;Password=${DB_PASSWORD:-postgres}
    volumes:
      - ~/.aspnet/https:/https:ro
    depends_on:
      - keycloak
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak}
      - KC_HOSTNAME=keycloak
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_PROXY=edge
    ports:
      - "8181:8080"
    depends_on:
      - db
    command: ["start-dev"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=account_service
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: