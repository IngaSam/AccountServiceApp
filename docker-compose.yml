services:
  db:
    image: postgres:16
    env_file: .env
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=account_service      
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-keycloak.sql:/docker-entrypoint-initdb.d/init-keycloak.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    env_file: .env
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=password 
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_PROXY=none 
      - KC_HOSTNAME=localhost
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_RELATIVE_PATH=/auth 
      - KC_LOG_LEVEL=INFO
      - JAVA_OPTS=-Xms512m -Xmx1024m 
    command:
      - start-dev     
    ports:
      - "8181:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:  ["CMD-SHELL", "curl -f http://localhost:8080/auth/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  account-service:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=Host=db;Database=account_service;Username=postgres;Password=${DB_PASSWORD}
      - Authentication__Jwt__Authority=http://keycloak:8080/realms/account-service
      - Authentication__Jwt__Audience=account-service-client
      - Authentication__Jwt__Issuer=http://keycloak:8080/realms/account-service
      - Authentication__Jwt__Secret=YourVeryStrongSecretKeyAtLeast32CharsLong
      - JAVA_OPTS=-Xms512m -Xmx1024m   
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
       limits:
        memory: 1.5G

volumes:
   postgres_data: